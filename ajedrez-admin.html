<style>
:root{--g:#2f7d5b;--gd:#1f5a41;--bg:#f2f5f3;--card:#fff;--tx:#1d2b25;--mu:#66756d;--ln:#dfe7e2;--rd:#c0392b;--yl:#f2b134;--r:16px}

button,input,select,textarea{font:inherit;font-size:16px}

.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--rd);color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--gd)}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}

.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:12px}

.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:0 16px;min-height:44px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--gd)}.btn.ghost{background:#fff;color:var(--gd);border:2px solid var(--g)}
.btn.red{background:var(--rd)}.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:10px}.btn:disabled{opacity:.5}
.btn.wide{width:100%}.btn.big{width:100%;min-height:54px;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
input,select,textarea{border:2px solid var(--ln);border-radius:12px;padding:0 12px;min-height:46px;background:#fff;color:var(--tx);width:100%}
textarea{padding:10px 12px;min-height:150px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--g);flex:none}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
label.f{display:block;font-weight:700;font-size:.9rem;color:var(--mu);margin:10px 0 4px}
.mono{font-family:ui-monospace,Consolas,monospace;font-weight:800}

.pill.espera{background:#fff3d6;color:#8a5a00}.pill.activo{background:#d9f5e3;color:#14703a}.pill.terminado{background:#e7e7ee;color:#555}
.muted{color:var(--mu);font-size:.88rem}.err{color:var(--rd);font-weight:700}
.empty{color:var(--mu);text-align:center;padding:18px 8px}

.hello b{font-size:1.25rem;display:block}.hello span{opacity:.85;font-size:.9rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:16px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;box-shadow:0 1px 0 #0000000a}
.tile:active{transform:scale(.98);background:#f7faf8}
.tile .ic{font-size:2rem}.tile b{font-size:1.02rem}.tile span{color:var(--mu);font-size:.84rem}
.tile .dot{top:10px;right:10px;border-color:#fff}
.live{border:2px solid #27ae60;background:#f1fbf5}

.li .pos{width:30px;text-align:center;font-weight:800;flex:none}.li .pts{font-weight:900;font-size:1.15rem;flex:none}
.li.off{opacity:.45}
details.grp{background:#fff;border:1px solid var(--ln);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;min-height:56px;cursor:pointer;font-weight:800}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--mu);transition:transform .15s}details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp[open]>summary{border-bottom:1px solid var(--ln)}
.ib2{width:42px;height:42px;border:0;border-radius:12px;background:#eef4f0;color:var(--gd);font-size:1.25rem;font-weight:900;cursor:pointer;flex:none}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:flex;background:#e3ebe6;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}

.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:8px 10px calc(12px + env(safe-area-inset-bottom));animation:up .18s ease-out;max-height:85vh;overflow:auto}

.sheet .st{font-weight:800;color:var(--mu);font-size:.88rem;padding:4px 10px 8px}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:0 12px;min-height:54px;font-weight:700;border-radius:12px;cursor:pointer;color:var(--tx)}
.sheet button:active{background:#f0f5f2}.sheet button.red{color:var(--rd)}.sheet button .e{font-size:1.3rem;width:28px;text-align:center}
.login{max-width:380px;margin:0 auto;padding:10vh 18px 20px;text-align:center}.login img{width:96px;height:96px;border-radius:24px;box-shadow:0 6px 18px #0002}
.login input{margin:6px 0}.login .btn{width:100%;margin-top:8px;min-height:52px}
.proj{position:fixed;inset:0;background:#10241b;color:#fff;z-index:60;padding:3vh 4vw;overflow:auto}
.proj h1{margin:0 0 2vh;font-size:max(1.4rem,3.2vw)}.proj table{width:100%;border-collapse:collapse;font-size:max(1.05rem,2.4vw);color:#fff}.proj td,.proj th{border-bottom:1px solid #ffffff30;padding:1vh 1vw;text-align:left}.proj th{color:#9fd9bb}.proj .n{text-align:right}
.proj .x{position:fixed;right:14px;top:14px}
.sheetov{position:fixed;inset:0;background:#fff;z-index:70;overflow:auto;padding:12px}.sheetov .bar2{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:0;width:190mm;max-width:100%;margin:0 auto}
.cd{border:1px dashed #888;padding:1.5mm 3mm;height:14.5mm;display:flex;flex-direction:column;justify-content:center;gap:.6mm;page-break-inside:avoid;overflow:hidden;line-height:1.15}
.cd .nm{font-size:10.5pt;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd .gp{font-weight:600;color:#555}.cd .cl{font-size:8.5pt;color:#555;white-space:nowrap}.cd .cr{font-size:11pt;color:#000;font-family:ui-monospace,Consolas,monospace;font-weight:800;letter-spacing:.03em}
@media print{body>*:not(.sheetov){display:none!important}.sheetov{position:static;padding:0}.sheetov .bar2{display:none}.cards{width:190mm}@page{size:A4;margin:10mm}}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
body.framed main{max-width:none;padding:0}

<div id="app"></div><div id="toasts"></div>
<script>
/* ===== Firebase por REST (sin SDK, sin dependencias) ===== */
const FBC={apiKey:"AIzaSyC4YHA4G1LWqs0ASkcD7Nlq89DTh4ZB_Mw",projectId:"ajedrez-siurot",domain:"ajedrez-siurot.app",admin:"manuelvsanchez@gmail.com"};
const FB=(()=>{
 const AUTH='https://identitytoolkit.googleapis.com/v1/accounts:',TOK='https://securetoken.googleapis.com/v1/token?key='+FBC.apiKey,
  FS='https://firestore.googleapis.com/v1/projects/'+FBC.projectId+'/databases/(default)/documents';
 const K='?key='+FBC.apiKey;
 function toV(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(Array.isArray(v))return{arrayValue:{values:v.map(toV)}};if(typeof v==='object')return{mapValue:{fields:enc(v)}};return{stringValue:String(v)};}
 function enc(o){const f={};for(const k in o)if(o[k]!==undefined)f[k]=toV(o[k]);return f;}
 function fromV(v){if('nullValue'in v)return null;if('booleanValue'in v)return v.booleanValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return v.doubleValue;if('stringValue'in v)return v.stringValue;if('arrayValue'in v)return(v.arrayValue.values||[]).map(fromV);if('mapValue'in v)return dec({fields:v.mapValue.fields});if('timestampValue'in v)return Date.parse(v.timestampValue);return null;}
 function dec(d){const o={};if(d.name)o.id=d.name.split('/').pop();const f=d.fields||{};for(const k in f)o[k]=fromV(f[k]);return o;}
 async function req(url,opt={},tries=1){
  let last;
  for(let i=0;i<tries;i++){
   const ac=new AbortController();const to=setTimeout(()=>ac.abort(),15000);
   try{const r=await fetch(url,{...opt,signal:ac.signal});clearTimeout(to);
    let j=null;const tx=await r.text();try{j=tx?JSON.parse(tx):null;}catch(e){}
    if(!r.ok){const e=new Error((j&&j.error&&(j.error.message||j.error.status))||('HTTP '+r.status));e.status=r.status;e.code=(j&&j.error&&j.error.message)||'';throw e;}
    return j;}
   catch(e){clearTimeout(to);last=e;if(e.status)throw e;if(i<tries-1)await new Promise(r=>setTimeout(r,600));}
  }
  last.offline=true;throw last;
 }
 const post=(u,b)=>req(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)},2);
 const S={user:null,onChange:null};
 const save=()=>{if(S.onChange)S.onChange(S.user);};
 const emailOf=a=>a.includes('@')?a:a+'@'+FBC.domain;
 function pack(r){return{uid:r.localId,email:r.email,idToken:r.idToken,refresh:r.refreshToken,exp:Date.now()+(+r.expiresIn||3600)*1000};}
 const api={
  S,emailOf,req,
  signIn:(a,pw)=>post(AUTH+'signInWithPassword'+K,{email:emailOf(a),password:pw,returnSecureToken:true}).then(pack),
  signAnon:()=>post(AUTH+'signUp'+K,{returnSecureToken:true}).then(pack),
  signUp:(a,pw)=>post(AUTH+'signUp'+K,{email:emailOf(a),password:pw,returnSecureToken:true}).then(pack),
  delAccount:idToken=>post(AUTH+'delete'+K,{idToken}),
  setAlias:(idToken,a)=>post(AUTH+'update'+K,{idToken,email:emailOf(a),returnSecureToken:true}).then(pack),
  setPass:(idToken,pw)=>post(AUTH+'update'+K,{idToken,password:pw,returnSecureToken:true}).then(pack),
  async login(a,pw){S.user=await api.signIn(a,pw);save();return S.user;},
  restore(u){S.user=u;},
  logout(){S.user=null;save();},
  async tok(){const u=S.user;if(!u)return null;
   if(u.exp-Date.now()<90000){try{const r=await req(TOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(u.refresh)},2);
    u.idToken=r.id_token;u.refresh=r.refresh_token||u.refresh;u.exp=Date.now()+(+r.expires_in||3600)*1000;save();}
    catch(e){if(e.status&&S.reauth){try{const nu=await S.reauth();if(nu){S.user=nu;save();return nu.idToken;}}catch(x){}}throw e;}}   // la sesión NO se borra sola: se recupera en silencio
   return u.idToken;},
  async H(tok){const t=tok===undefined?await api.tok():tok;return t?{Authorization:'Bearer '+t}:{};},
  async get(path,tok){try{return dec(await req(FS+'/'+path,{headers:await api.H(tok)},2));}catch(e){if(e.status===404)return null;throw e;}},
  async set(path,obj,mask,tok){const q=mask?'?'+mask.map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&'):'';
   return dec(await req(FS+'/'+path+q,{method:'PATCH',headers:{...await api.H(tok),'Content-Type':'application/json'},body:JSON.stringify({fields:enc(obj)})},2));},
  async del(path,tok){return req(FS+'/'+path,{method:'DELETE',headers:await api.H(tok)},2);},
  async list(path,tok){const out=[];let pt='';do{const r=await req(FS+'/'+path+'?pageSize=300'+(pt?'&pageToken='+encodeURIComponent(pt):''),{headers:await api.H(tok)},2);(r.documents||[]).forEach(d=>out.push(dec(d)));pt=r.nextPageToken||'';}while(pt);return out;},
  /* consulta con filtro: solo se cobran los documentos devueltos */
  async query(coll,{where,orderBy,limit}={},tok){const sq={from:[{collectionId:coll}]};
   if(where){const[f,op,v]=where;sq.where={fieldFilter:{field:{fieldPath:f},op,value:toV(v)}};}
   if(orderBy)sq.orderBy=[{field:{fieldPath:orderBy[0]},direction:orderBy[1]==='desc'?'DESCENDING':'ASCENDING'}];
   if(limit)sq.limit=limit;
   const r=await req(FS+':runQuery',{method:'POST',headers:{...await api.H(tok),'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:sq})},2);
   return(r||[]).filter(x=>x&&x.document).map(x=>dec(x.document));},
  msg(e){const c=(e&&e.code||e&&e.message||'')+'';
   if(e&&e.offline)return'Sin conexión con el servidor. Comprueba internet.';
   if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(c))return'Usuario o clave incorrectos.';
   if(/TOO_MANY/.test(c))return'Demasiados intentos. Espera unos minutos.';
   if(/EMAIL_EXISTS/.test(c))return'Ese usuario ya existe.';
   if(/PERMISSION|403/.test(c)||e&&e.status===403)return'Sin permiso para hacer eso.';
   return'Error: '+c.slice(0,80);}
 };
 return api;
})();
/* Realtime Database por REST (presencia, retos y partidas) */
const RT=(()=>{const B='https://ajedrez-siurot-default-rtdb.europe-west1.firebasedatabase.app/';
 const url=async(p,q)=>{const t=await FB.tok();return B+p+'.json?auth='+encodeURIComponent(t||'')+(q?'&'+q:'');};
 const SV={'.sv':'timestamp'};
 return{B,SV,off:0,srv(){return Date.now()+RT.off;},
  async get(p){return FB.req(await url(p),{},2);},
  async put(p,v){return FB.req(await url(p),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async patch(p,v){return FB.req(await url(p),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async post(p,v){return FB.req(await url(p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async del(p){return FB.req(await url(p),{method:'DELETE'},2);},
  /* escrituras «silenciosas»: Firebase no devuelve lo escrito (menos datos descargados) */
  async putS(p,v){return FB.req(await url(p,'print=silent'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async patchS(p,v){return FB.req(await url(p,'print=silent'),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async sync(p){const r=await RT.put(p,SV);if(typeof r==='number')RT.off=r-Date.now();return r;}};
})();
/* Escucha en directo (Server-Sent Events del REST de Realtime Database): llega la foto inicial y después SOLO los cambios
   (mucho menos tráfico que preguntar cada segundo). Si no se puede (sin permiso, límite de conexiones…) lee cada pocos segundos.
   Con la app en segundo plano la conexión se cierra (ahorra datos y conexiones) y al volver se abre de nuevo. */
function rtWatch(path,o){o=o||{};const auth=o.auth!==false,poll=o.poll||4000;
 let es=null,data=null,dead=false,pt=null,fails=0,mode='sse',hidT=null,last=0,wd=null,retryT=null,gen=0;
 const emit=()=>{try{o.onData&&o.onData(data);}catch(e){console.error(e);}};
 const setAt=(p,v)=>{const ks=String(p||'').split('/').filter(Boolean);if(!ks.length){data=v===undefined?null:v;return;}
  if(data===null||typeof data!=='object')data={};let n=data;for(let i=0;i<ks.length-1;i++){if(n[ks[i]]===null||typeof n[ks[i]]!=='object')n[ks[i]]={};n=n[ks[i]];}
  const k=ks[ks.length-1];if(v===null||v===undefined)delete n[k];else n[k]=v;};
 const stop1=()=>{gen++;if(es){try{es.close();}catch(e){}es=null;}clearInterval(pt);pt=null;clearInterval(wd);wd=null;};
 const urlOf=async()=>RT.B+path+'.json'+(auth?'?auth='+encodeURIComponent((await FB.tok())||''):'');
 async function pollOnce(){try{const r=await fetch(await urlOf());if(r.ok){data=await r.json();last=Date.now();emit();}}catch(e){}}
 function startPoll(){if(pt)return;pollOnce();pt=setInterval(()=>{if(!document.hidden)pollOnce();},poll);
  clearTimeout(retryT);retryT=setTimeout(()=>{if(!dead&&mode==='poll'){mode='sse';fails=0;open();}},120000);}
 async function open(){if(dead)return;stop1();if(document.hidden)return;const my=gen;
  if(mode==='poll'||typeof EventSource==='undefined')return startPoll();
  let u;try{u=await urlOf();}catch(e){mode='poll';return startPoll();}
  if(dead||my!==gen)return;
  try{es=new EventSource(u);}catch(e){mode='poll';return startPoll();}
  last=Date.now();
  es.addEventListener('put',e=>{try{const j=JSON.parse(e.data);setAt(j.path,j.data);fails=0;last=Date.now();emit();}catch(x){}});

  if(k==='gp')return groupProg(g,gl);

async function bulkDel(g){
 const groups=[...new Set(A.users.map(gOf))].sort((a,b)=>a.localeCompare(b,'es'));if(!groups.length)return toast('No hay grupos',1);
 if(!g){const r=await askM('🗑 Borrar un grupo entero',`<p>Elige el grupo que quieres borrar:</p><select>${groups.map(x=>`<option value="${esc(x)}">${esc(x)} (${A.users.filter(u=>gOf(u)===x).length})</option>`).join('')}</select>`,'Continuar');if(!r)return;g=r[0];}
 const list=A.users.filter(u=>gOf(u)===g);if(!list.length)return toast('Ese grupo está vacío',1);
 return delUsers(list,`del grupo <b>${esc(g)}</b>`,`de «${esc(g)}»`,'Borrar grupo',()=>{A.open.delete(g);A.grupos=A.grupos.filter(x=>x!==g);saveGroups().catch(()=>{});},`Grupo «${g}» eliminado`);}
/* borra varios usuarios (con doble aviso): grupo entero o solo los marcados */
async function delUsers(list,de,de2,btn,after,okMsg){
 if(!await confirmM('⚠️ Aviso 1 de 2',`Vas a eliminar a <b>${list.length} usuario${list.length>1?'s':''}</b> ${de}.<br><br>Se borran sus cuentas, sus claves y su puntuación del salón de la fama.${list.length<=12?'<br><br>'+list.map(u=>esc(nm(u))).join(', '):''}`,'Continuar',true))return;
 const r2=await askM('🛑 Aviso 2 de 2',`<p><b>Esta acción NO se puede deshacer.</b> Se borrarán ${list.length} usuario${list.length>1?'s':''} ${de2}.</p><p>Para confirmar, escribe <b>BORRAR</b>:</p><input autocomplete="off" autocapitalize="characters">`,btn);
 if(!r2||r2[0].trim().toUpperCase()!=='BORRAR')return r2?toast('No has escrito BORRAR: no se ha borrado nada',1):0;
 let n=0,fail=0;
 for(const u of list){toast(`Borrando ${++n} de ${list.length}…`);
  try{try{const s=await FB.signIn(u.alias,u.clave);await FB.delAccount(s.idToken);}catch(e){}
   await FB.del('users/'+u.id);try{await FB.del('hof/'+u.id);}catch(e){}try{await RT.del('liga/'+u.id);}catch(e){}
   A.users=A.users.filter(x=>x.id!==u.id);A.hof=A.hof.filter(x=>x.id!==u.id);A.sel.delete(u.id);}catch(e){fail++;}}
 if(after)after();
 toast(fail?`Borrados ${list.length-fail}; fallaron ${fail}`:`${okMsg||'Eliminados'} (${list.length})`,!!fail);render();}
const delMarked=()=>{const l=A.users.filter(u=>A.sel.has(u.id));if(!l.length)return toast('No hay nadie marcado',1);return delUsers(l,'<b>marcados</b>','marcados','Borrar marcados',null,'Usuarios eliminados');};
async function userAct(a,u){

  try{try{const s=await FB.signIn(u.alias,u.clave);await FB.delAccount(s.idToken);}catch(e){}
   await FB.del('users/'+u.id);try{await FB.del('hof/'+u.id);}catch(e){}
   A.users=A.users.filter(x=>x.id!==u.id);A.hof=A.hof.filter(x=>x.id!==u.id);A.sel.delete(u.id);toast('Usuario eliminado');render();}catch(e){toast(FB.msg(e),1);}}
 if(a==='rs'){if(!await confirmM('Nueva clave',`Se generará una clave nueva para <b>${esc(nm(u))}</b>. La anterior dejará de funcionar.`,'Generar'))return;
  try{const nc=genClave();const s=await FB.signIn(u.alias,u.clave);await FB.setPass(s.idToken,nc);await FB.set('users/'+u.id,{clave:nc},['clave']);u.clave=nc;
   await modal({title:'🔑 Nueva clave',html:`<p style="text-align:center">Usuario: <span class="mono">${esc(u.alias)}</span><br>Clave: <span class="mono" style="font-size:1.6rem">${nc}</span></p>`,buttons:[{t:'🖨️ Tarjeta',cls:'ghost',v:()=>{printCards([u]);return 1;}},{t:'Cerrar',v:1}]});render();}catch(e){toast(FB.msg(e),1);}}
 if(a==='ed'){const r=await askM('✏️ Editar jugador',`<label class="f">Nombre</label><input value="${esc(u.nombre)}" maxlength="30" autocomplete="off"><label class="f">Usuario (para entrar)</label><input value="${esc(u.alias)}" maxlength="24" autocomplete="off" autocapitalize="none"><label class="f">Grupo</label>${groupSelect('eg',u.grupo)}<p class="muted" style="margin:10px 0 0;font-size:.85rem">Si cambias el usuario, el alumno tendrá que entrar de nuevo con el nuevo. La clave no cambia.</p>`,'Guardar',bg=>groupBind(bg,'eg'));if(!r)return;
  const nombre=r[0].trim(),alias=r[1].trim().toLowerCase();let grupo=r[2];
  if(!nombre)return toast('El nombre no puede estar vacío',1);
  if(!/^[a-z0-9]{2,24}$/.test(alias))return toast('El usuario solo puede tener letras sin tilde y números (2 a 24)',1);

  if(grupo==='__new'){const g=await newGroup(r[3]);if(!g)return;grupo=g;}grupo=String(grupo||'').trim();

   await FB.set('users/'+u.id,{nombre,alias,grupo},['nombre','alias','grupo']);
   if(A.hof.some(x=>x.id===u.id)){try{await FB.set('hof/'+u.id,{nombre,alias,grupo},['nombre','alias','grupo']);}catch(e){}A.hof.forEach(x=>{if(x.id===u.id){x.nombre=nombre;x.alias=alias;x.grupo=grupo;}});}
   u.nombre=nombre;u.alias=alias;u.grupo=grupo;toast('Guardado ✔️');render();}catch(e){toast(FB.msg(e),1);}}}

function vAlta(m){const one=A.alta!=='grupo';const g0=A.altaG||'';A.altaG='';

 <p class="muted" style="margin:0 4px 12px">Solo nombre e inicial del apellido. El usuario será nombre + inicial (ej. «Lucía M.» → <span class="mono">luciam</span>) y la clave, 3 números y 3 letras.</p>
 <div id="res"></div>`;groupBind(m,'gs');

 const go=async names=>{if(!names.map(x=>x.trim()).filter(Boolean).length)return toast('Escribe algún nombre',1);const g=await groupValue(m,'gs');if(!g)return;A.lastG=g;createUsers(names,g,m);};

async function createUsers(names,grupo,m){names=names.map(s=>s.trim()).filter(Boolean);if(!names.length)return toast('Escribe algún nombre',1);
 const used=new Set(A.users.map(u=>u.alias));const out=[],fail=[];$$('button',m).forEach(b=>b.disabled=true);
 const prog=$('#res',m);
 for(let i=0;i<names.length;i++){prog.innerHTML=`<div class="card">⏳ Creando ${i+1} de ${names.length}…</div>`;
  const nombre=names[i];const base=slugAlias(nombre);if(!base){fail.push([nombre,'Nombre no válido']);continue;}
  let ok=false,n=0;while(!ok&&n<30){const alias=n?base+(n+1):base;n++;if(used.has(alias))continue;const clave=genClave();
   try{const s=await FB.signUp(alias,clave);const u={alias,nombre,grupo,clave,ultimoLogin:null,alta:Date.now()};await FB.set('users/'+s.uid,u);used.add(alias);const nu={id:s.uid,...u};A.users.push(nu);out.push(nu);ok=true;}
   catch(e){if(/EMAIL_EXISTS/.test(e.code||'')){used.add(alias);continue;}fail.push([nombre,FB.msg(e)]);break;}}

 else{let pending=false;st.e=st.e||{};
  for(const [gid,pr] of Object.entries(st.g||{})){let g=null;try{g=await RT.get('games/'+gid);}catch(e){pending=true;continue;}
   if(g&&g.st==='play'){if(now-(st.t||now)>gmMax(t)){await RT.patch('games/'+gid,{st:'end',res:'1/2-1/2',why:'tiempo'});g.st='end';g.res='1/2-1/2';}else{pending=true;continue;}}
   if(!st.e[gid]){st.e[gid]=now;await RT.patch(`arena/${t.id}/r/e`,{[gid]:now});pending=true;continue;}
   if(now-st.e[gid]<20000){pending=true;continue;}
   const res=g?g.res:'1/2-1/2',sw=res==='1-0'?1:res==='0-1'?0:.5;
   await swRecord(t,lv,pr.w,gid,sw,pr.b);await swRecord(t,lv,pr.b,gid,1-sw,pr.w);}
  if(pending)return false;
  if(!st.te){await RT.patch(`arena/${t.id}/r`,{te:now});return false;}
  if(now-st.te<15000)return false;}
 // jugadores presentes (conectados en el último minuto y no descalificados)
 const pres=Object.entries(lv).filter(([id,p])=>p&&!p.fuera&&!p.sal&&now-Math.max(hb[id]||0,p.hb||0)<70000).map(([id,p])=>({id,...p}));
 let total=t.tipo==='rr'?(t.rondasRR||0):(t.rondas||5);
 let roster=st.rr||null;
 if(t.tipo==='rr'&&!n){roster=pres.map(p=>p.id).sort();if(roster.length%2)roster.push('BYE');total=roster.length-1;
  await FB.set('torneos/'+t.id,{rondasRR:total},['rondasRR']);t.rondasRR=total;}
 if(n>=total&&n>0){await finishTorneo(t);toast('🏁 «'+t.nombre+'» terminado');return true;}
 if(pres.length<2){if(!n&&now>t.inicioReal+60000)toast(`«${t.nombre}»: esperando al menos 2 jugadores…`);return false;}
 const k=n+1;let pairs=[],bye=null;
 if(t.tipo==='rr'){const N=roster.length,arr=[roster[0],...rotate(roster.slice(1),n)];
  for(let i=0;i<N/2;i++){let a=arr[i],b=arr[N-1-i];if(a==='BYE'||b==='BYE'){bye=a==='BYE'?b:a;continue;}if(!lv[a]||lv[a].fuera||!lv[b]||lv[b].fuera)continue;pairs.push((n+i)%2?[b,a]:[a,b]);}}
 else{const pl=pres.slice().sort((a,b)=>(b.pts||0)-(a.pts||0)||(b.e||800)-(a.e||800));
  if(pl.length%2){const c=pl.slice().reverse().find(p=>!p.bye)||pl[pl.length-1];bye=c.id;pl.splice(pl.indexOf(c),1);}
  const used=new Set();
  for(const a of pl){if(used.has(a.id))continue;let b=pl.find(x=>!used.has(x.id)&&x.id!==a.id&&!(a.vs&&a.vs[x.id]!==undefined));if(!b)b=pl.find(x=>!used.has(x.id)&&x.id!==a.id);if(!b)continue;used.add(a.id);used.add(b.id);
   const cwA=a.cw||0,cwB=b.cw||0;pairs.push(cwA<=cwB?[a.id,b.id]:[b.id,a.id]);}}
 const tcO=ritmoOf(t.ritmo),G={},bt=Date.now();
 for(const [w,b] of pairs){const W=lv[w],B=lv[b],gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await RT.put('games/'+gid,{w,b,wn:W.n,bn:B.n,we:W.e||800,be:B.e||800,tc:t.ritmo||'3+0',tb:tcO.m*60000,ti:tcO.i*1000,moves:'',clk:{w:tcO.m*60000,b:tcO.m*60000},ts:{'.sv':'timestamp'},turn:'w',st:'play',draw:'',res:'',why:'',ar:t.id,af:0,fu:t.furia===false?0:1});
  await Promise.all([RT.patch(`arena/${t.id}/p/${w}`,{busy:gid,bt:{'.sv':'timestamp'},wait:null,cw:(W.cw||0)+1}),RT.patch(`arena/${t.id}/p/${b}`,{busy:gid,bt:{'.sv':'timestamp'},wait:null,cw:(B.cw||0)-1})]);
  RT.put('live/'+gid,{wn:W.n,bn:B.n,tc:t.ritmo||'3+0',ar:t.id,t:{'.sv':'timestamp'}}).catch(()=>{});G[gid]={w,b};}
 if(bye&&lv[bye]){const p=lv[bye];await RT.patch(`arena/${t.id}/p/${bye}`,{pts:(p.pts||0)+2,pa:(p.pa||0)+1,bye:true});}
 await RT.put(`arena/${t.id}/r`,{n:k,g:G,t:bt,bye:bye||null,...(roster?{rr:roster}:{})});
 toast(`♟ «${t.nombre}»: ronda ${k} emparejada (${pairs.length} partidas)`);return true;}
/* ---------- progreso del alumnado (Realtime Database «perfil/»: no gasta lecturas de Firestore) ---------- */
async function showProg(uid,name){const p=modal({title:'📊 '+esc(name||''),html:'<div id="pgx"><p class="muted">Cargando…</p></div>',buttons:[{t:'Cerrar',cls:'ghost',v:null}]});
 const bg=$$('.mbg').pop();let s=null;try{s=await RT.get('perfil/'+uid);}catch(e){}const x=bg&&$('#pgx',bg);if(x)x.innerHTML=profileHTML(s);return p;}
async function groupProg(g,gl){const p=modal({title:'📊 Progreso · '+esc(g),html:'<div id="gpx"><p class="muted">Cargando…</p></div>',buttons:[{t:'Cerrar',cls:'ghost',v:null}]});
 const bg=$$('.mbg').pop();if(bg)$('.modal',bg).style.maxWidth='760px';
 const rows=await Promise.all(gl.map(async u=>{let s=null;try{s=await RT.get('perfil/'+u.id);}catch(e){}return{u,s};}));
 let key='xp',dir=-1;const val=(r,k)=>{const s=r.s;if(k==='n')return nm(r.u).toLowerCase();if(!s)return -1;return k==='xp'?s.xp||0:k==='elo'?s.elo||0:k==='lec'?(s.lec||[0])[0]:k==='pz'?s.pz||0:k==='on'?((s.on||{}).w||0):k==='t'?s.t||0:0;};
 const cols=[['n','Alumno'],['xp','XP · rango'],['elo','ELO'],['lec','Lecciones'],['pz','Ejercicios'],['on','Online G·T·P'],['t','Actualizado']];
 const draw=()=>{const x=bg&&$('#gpx',bg);if(!x)return;const l=rows.slice().sort((a,b)=>{const A1=val(a,key),B1=val(b,key);return(A1<B1?-1:A1>B1?1:0)*dir;});
  x.innerHTML=`<p class="muted" style="margin:0 0 8px">Toca una columna para ordenar y un alumno para ver su progreso completo. ${rows.filter(r=>!r.s).length?`${rows.filter(r=>!r.s).length} sin datos todavía (aún no han abierto la app actualizada).`:''}</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr>${cols.map(([k,t])=>`<th data-k="${k}" style="text-align:left;padding:6px;cursor:pointer;border-bottom:2px solid #ddd;white-space:nowrap">${t}${key===k?(dir<0?' ▼':' ▲'):''}</th>`).join('')}</tr></thead><tbody>${l.map(r=>{const s=r.s;return`<tr data-u="${r.u.id}" style="cursor:pointer;border-bottom:1px solid #eee"><td style="padding:6px"><b>${esc(nm(r.u))}</b></td>${s?`<td>${esc(s.rk&&s.rk.ic||'')} ${s.xp||0}</td><td>${s.elo||800}</td><td>${(s.lec||[0,0])[0]}/${(s.lec||[0,0])[1]}</td><td>${s.pz||0}</td><td>${(s.on||{}).w||0}·${(s.on||{}).d||0}·${(s.on||{}).l||0}</td><td class="muted">${s.t?fdate(s.t).slice(0,8):''}</td>`:'<td colspan="6" class="muted">Sin datos</td>'}</tr>`;}).join('')}</tbody></table></div>`;
  $$('th[data-k]',x).forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(key===k)dir=-dir;else{key=k;dir=k==='n'?1:-1;}draw();});
  $$('tr[data-u]',x).forEach(tr=>tr.onclick=()=>{const r=rows.find(y=>y.u.id===tr.dataset.u);if(r)showProg(r.u.id,nm(r.u));});};
 draw();return p;}
const rotate=(a,k)=>{const n=a.length;if(!n)return a;k=k%n;return a.slice(n-k).concat(a.slice(0,n-k));};
async function finishTorneo(t){
 let lv={};try{lv=await RT.get(`arena/${t.id}/p`)||{};}catch(e){}
 for(const [uid,p] of Object.entries(lv))if(!p.guest)await FB.set(`torneos/${t.id}/jugadores/${uid}`,{alias:p.a||'',nombre:p.n||'',grupo:p.g||'',puntos:p.pts||0,partidas:p.pa||0,fuera:!!p.fuera});
 const rk=arenaRank(Object.entries(lv).filter(([id,p])=>p&&!p.fuera).map(([id,p])=>({id,...p}))),pos=Object.fromEntries(rk.map((r,i)=>[r.id,i]));
 const js=(await FB.list(`torneos/${t.id}/jugadores`)).sort((a,b)=>(pos[a.id]??1e6)-(pos[b.id]??1e6)||(b.puntos||0)-(a.puntos||0)||(b.partidas||0)-(a.partidas||0));
 const ok=js.filter(j=>!j.fuera&&((j.partidas||0)>0||(j.puntos||0)>0));
 const podio=ok.slice(0,3).map(j=>({alias:j.alias,nombre:j.nombre,puntos:j.puntos||0}));
 const clasif=rk.filter(r=>(r.pa||0)>0||(r.pts||0)>0).slice(0,60).map(r=>({u:r.guest?'':r.id,n:r.n,g:r.g||'',p:r.pts||0,w:r.w||0,d:r.d||0,l:r.l||0}));
 for(const j of ok){const h=A.hof.find(x=>x.id===j.id)||{id:j.id,puntos:0,torneos:0,mejor:0};const n={alias:j.alias,nombre:j.nombre,grupo:j.grupo||'',puntos:(h.puntos||0)+(j.puntos||0),torneos:(h.torneos||0)+1,mejor:Math.max(h.mejor||0,j.puntos||0)};await FB.set('hof/'+j.id,n);const i=A.hof.findIndex(x=>x.id===j.id);i<0?A.hof.push({id:j.id,...n}):A.hof[i]={id:j.id,...n};}
 const fin=(t.tipo||'arena')==='arena'&&tFin(t)?Math.min(Date.now(),tFin(t)):Date.now();
 const p={estado:'terminado',fin,podio,clasif};await FB.set('torneos/'+t.id,p,Object.keys(p));Object.assign(t,p);
 /* historial para el alumnado (Realtime Database: sin lecturas de Firestore): resumen, clasificación y «mis torneos» */
 try{const h={['t/'+t.id]:{n:t.nombre,f:fin,tipo:t.tipo||'arena',r:t.ritmo||'3+0',c:clasif},['i/'+t.id]:{n:t.nombre,f:fin,tipo:t.tipo||'arena',r:t.ritmo||'3+0',np:clasif.length}};
  clasif.forEach((c,i)=>{if(c.u)h['u/'+c.u+'/'+t.id]={n:t.nombre,f:fin,pos:i+1,p:c.p,np:clasif.length};});await RT.patch('hist',h);}catch(e){}
 try{await RT.del('arena/'+t.id);}catch(e){}RT.del('ahb/'+t.id).catch(()=>{});RT.del('pub/ins/'+t.id).catch(()=>{});setTimeout(()=>RT.del('arena/'+t.id).catch(()=>{}),9000);pubPing();}
/* automático: la hora se vigila en local cada 5 s (sin lecturas) y solo se consultan a Firebase los torneos pendientes o en marcha:
   cada 30 s si hay alguno abierto, cada 2 min si no hay ninguno (y al momento si otro dispositivo avisa de un cambio) */
let autoBusy=false,lastRefresh=0,needRefresh=true;
async function refreshOpen(){
 const open=await FB.query('torneos',{where:['estado','IN',['espera','activo']]});const ids=new Set(open.map(x=>x.id));
 for(const f of open){const o=A.torneos.find(x=>x.id===f.id);if(o)Object.assign(o,f);else A.torneos.unshift(f);}
 for(const o of A.torneos.filter(x=>x.estado!=='terminado'&&!ids.has(x.id))){const f=await FB.get('torneos/'+o.id);if(f)Object.assign(o,f);else A.torneos=A.torneos.filter(x=>x!==o);}
 lastRefresh=Date.now();needRefresh=false;}
async function autoTick(){if(autoBusy||!FB.S.user||!$('#main'))return;autoBusy=true;let changed=false;
 try{const anyOpen=A.torneos.some(t=>t.estado!=='terminado');
  if(needRefresh||Date.now()-lastRefresh>(anyOpen?30000:120000)){const before=JSON.stringify(A.torneos.map(t=>[t.id,t.estado,t.nombre,t.inicio]));await refreshOpen();changed=before!==JSON.stringify(A.torneos.map(t=>[t.id,t.estado,t.nombre,t.inicio]));}
  const now=Date.now();
  for(const t of A.torneos){
   const ar=(t.tipo||'arena')==='arena',fin=ar?tFin(t):0;
   if(ar&&t.estado!=='terminado'&&fin&&now>fin+12000){await finishTorneo(t);changed=true;toast('🏁 «'+t.nombre+'» terminado: puntos sumados al salón de la fama');}
   else if(t.estado==='espera'&&t.inicio&&t.inicio<=now){await activar(t);changed=true;toast('🟢 «'+t.nombre+'» ha empezado');}
   else if(t.estado==='activo'&&!ar){if(typeof roundTick==='function'&&await roundTick(t))changed=true;}}
  if(changed&&!document.querySelector('.mbg')&&!document.querySelector('.proj')&&!document.querySelector('.sheetov')&&!document.querySelector('.drbg')&&(A.tab==='torneos'&&!A.tid||A.tab==='hof'||A.tab==='inicio'))render();
 }catch(e){}autoBusy=false;}
setInterval(autoTick,5000);
/* aviso al instante si otro dispositivo cambia algo (misma señal que usa la app del alumnado) */
try{if(window.EventSource){let pv;const es=new EventSource(RT.B+'pub/v.json');es.addEventListener('put',e=>{try{const v=JSON.parse(e.data).data;if(pv!==undefined&&v!==pv)needRefresh=true;pv=v;}catch(x){}});}}catch(e){}
const seenReq=new Set();
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.18);}catch(e){}}
async function pollReq(){if(!FB.S.user||!$('#main'))return;let n=0,fresh=null;
 try{for(const t of A.torneos.filter(x=>x.estado==='activo')){const r=await RT.get(`arena/${t.id}/req`)||{};for(const [id,x] of Object.entries(r)){if(x&&x.s==='pend'){n++;if(!seenReq.has(id)){seenReq.add(id);fresh=x.n;}}}}}catch(e){return;}
 if(fresh){beep();try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}toast('🙋 '+fresh+' pide entrar al torneo');}
 if(n!==A.reqN){A.reqN=n;badges();if(A.tab==='inicio'&&!$('.mbg')&&!$('.drbg'))render();}
 if(fresh&&A.tab==='torneos'&&A.tid&&!$('.mbg')&&!$('.drbg')&&!document.querySelector('input:focus'))render();}
setInterval(pollReq,5000);
function projector(t,get,load){const ov=document.createElement('div');ov.className='proj';document.body.appendChild(ov);
 const close=()=>{clearInterval(iv);ov.remove();};ov._close=close;
 const paint=()=>{const l=get().filter(j=>!j.fuera).slice(0,12);ov.innerHTML=`<button class="btn x" id="px">✕ Cerrar</button><h1>🏆 ${esc(t.nombre)}</h1><table><thead><tr><th>#</th><th>Jugador</th><th>Grupo</th><th class="n">Puntos</th></tr></thead><tbody>${l.map((j,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(j.nombre)}</td><td>${esc(j.grupo)}</td><td class="n"><b>${j.puntos||0}</b></td></tr>`).join('')}</tbody></table>`;$('#px',ov).onclick=close;};
 paint();const iv=setInterval(async()=>{await load();paint();},10000);}
/* ---------- tareas, clase y fichas (se abre la herramienta del profe de la app de juego, con la sesión de admin) ---------- */
function vProfe(m){m.innerHTML=`<iframe src="index.html#profe" title="Tareas y fichas" style="width:100%;height:calc(100vh - 62px - env(safe-area-inset-top));border:0;display:block;background:#fbf7ee"></iframe>`;}
/* ---------- salón de la fama ---------- */
function vHof(m){const l=[...A.hof].sort((a,b)=>(b.puntos||0)-(a.puntos||0)).slice(0,10);
 m.innerHTML=`<div class="row" style="margin-bottom:10px"><p class="muted grow" style="margin:0 4px">Top 10 · suma de los puntos de todos los torneos terminados.</p><button class="ib2" id="opt" aria-label="Opciones">⋯</button></div>
 ${l.length?`<div class="list">${l.map((h,i)=>`<div class="li" style="cursor:default"><span class="pos">${['🥇','🥈','🥉'][i]||i+1}</span><div class="t"><b>${esc(h.nombre)}</b><span>${esc(h.grupo||'')} · ${h.torneos||0} torneos · mejor ${h.mejor||0}</span></div><span class="pts">${h.puntos||0}</span></div>`).join('')}</div>`:'<div class="card empty">Todavía no hay datos: termina algún torneo.</div>'}`;
 const backup=()=>download('salon-fama-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(A.hof,null,1),'application/json');
 $('#opt',m).onclick=async()=>{const k=await sheet('Salón de la fama',[{k:'bk',e:'⬇️',t:'Descargar copia de seguridad'},{k:'rs',e:'♻️',t:'Nuevo curso: vaciar el salón…',cls:'red'}]);
  if(k==='bk')backup();
  if(k==='rs'){const r=await askM('♻️ Vaciar salón de la fama',`<p>Se borrarán los puntos acumulados de <b>${A.hof.length}</b> jugadores. Antes se descargará una copia.</p><p>Escribe <b>RESTAURAR</b> para confirmar:</p><input autocomplete="off" autocapitalize="characters">`,'Vaciar');if(!r||r[0].trim().toUpperCase()!=='RESTAURAR')return r?toast('No coincide: no se ha borrado nada',1):0;
   try{backup();for(const h of A.hof)await FB.del('hof/'+h.id);A.hof=[];toast('Salón de la fama vacío');render();}catch(e){toast(FB.msg(e),1);}}};}
/* ---------- ajustes ---------- */
function vAjustes(m){const groups=allGroups();
 m.innerHTML=`<details class="box"><summary>📣 Aviso en la portada${A.cfg.aviso?' <span class="pill activo">activo</span>':''}</summary><div><p class="muted" style="margin:0 0 8px">Lo ve todo el alumnado. Déjalo vacío para quitarlo.</p><input id="av" maxlength="140" placeholder="Hoy torneo en el recreo a las 12:00" value="${esc(A.cfg.aviso)}"><label class="f">Enlace (opcional): al pulsar el aviso se abre esta dirección</label><input id="avl" inputmode="url" placeholder="https://lichess.org/tournament/…" value="${esc(A.cfg.avisoUrl||'')}"><label class="f">Dirección de la app (sale en las tarjetas de claves)</label><input id="ur" value="${esc(A.cfg.url)}" inputmode="url"><button class="btn big" id="sv" style="margin-top:12px">Guardar</button></div></details>
 <details class="box"><summary>⬆️ Subir de curso</summary><div><p class="muted" style="margin:0 0 8px">Cambia el nombre de los grupos de golpe (ej. 4ºA → 5ºA). Deja en blanco los que no cambien.</p>${groups.length?groups.map(g=>`<div class="row" style="margin:6px 0;flex-wrap:nowrap"><b style="min-width:84px">${esc(g)}</b><span class="muted">(${A.users.filter(u=>u.grupo===g).length})</span><span>→</span><input class="ng" data-g="${esc(g)}" placeholder="Nuevo" style="flex:1;min-width:0"></div>`).join('')+'<button class="btn big" id="up" style="margin-top:10px">Aplicar cambios</button>':'<p class="muted">Aún no hay grupos.</p>'}</div></details>
 <details class="box"><summary>📤 Exportar</summary><div><button class="btn ghost wide" id="cu">⬇️ Todo el alumnado (CSV)</button></div></details>
 <details class="box"><summary>🔒 Protección de datos</summary><div><p class="muted" style="margin:0">Solo se guardan un usuario (nombre + inicial), el grupo y la fecha del último acceso. Sin apellidos completos, sin correos ni datos personales. Servidor en la UE (Firestore eur3). Al eliminar un usuario se borra su cuenta y su puntuación.</p></div></details>
 ${standalone()?'':'<button class="btn ghost big" id="ins" style="margin-top:6px">📲 Instalar esta app en el móvil</button>'}
 <button class="btn ghost big" id="lo" style="margin-top:10px;color:var(--rd);border-color:var(--rd)">🚪 Cerrar sesión</button>`;
 $('#sv',m).onclick=async()=>{let lk=$('#avl',m).value.trim();if(lk&&!/^https?:\/\//i.test(lk))lk='https://'+lk;if(lk){try{new URL(lk);}catch(e){return toast('El enlace no es válido',1);}}const c={aviso:$('#av',m).value.trim(),avisoUrl:lk,url:$('#ur',m).value.trim()||'https://ajedrezsiurot.com/'};try{await FB.set('config/main',c);Object.assign(A.cfg,c);try{await pubSync();}catch(e){}toast('Guardado ✔️');render();}catch(e){toast(FB.msg(e),1);}};
 $('#cu',m).onclick=()=>download('usuarios-ajedrez.csv',csvUsers(A.users),'text/csv');
 if($('#ins',m))$('#ins',m).onclick=doInstall;$('#lo',m).onclick=logout;
 if($('#up',m))$('#up',m).onclick=async()=>{const map={};$$('.ng',m).forEach(i=>{if(i.value.trim())map[i.dataset.g]=i.value.trim();});const ks=Object.keys(map);if(!ks.length)return toast('No hay cambios',1);
  if(!await confirmM('Subir de curso',ks.map(k=>`${esc(k)} → <b>${esc(map[k])}</b>`).join('<br>'),'Aplicar'))return;
  try{const orig=A.users.map(u=>[u,u.grupo]);for(const [u,g] of orig)if(map[g]){await FB.set('users/'+u.id,{grupo:map[g]},['grupo']);u.grupo=map[g];}A.grupos=A.grupos.map(g=>map[g]||g);await saveGroups();toast('Grupos actualizados');render();}catch(e){toast(FB.msg(e),1);}};}
boot();
