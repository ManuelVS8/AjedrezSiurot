<style>

/* ===== Firebase por REST (sin SDK, sin dependencias) ===== */
const FBC={apiKey:"AIzaSyC4YHA4G1LWqs0ASkcD7Nlq89DTh4ZB_Mw",projectId:"ajedrez-siurot",domain:"ajedrez-siurot.app",admin:"manuelvsanchez@gmail.com"};
const FB=(()=>{
 const AUTH='https://identitytoolkit.googleapis.com/v1/accounts:',TOK='https://securetoken.googleapis.com/v1/token?key='+FBC.apiKey,
  FS='https://firestore.googleapis.com/v1/projects/'+FBC.projectId+'/databases/(default)/documents';
 const K='?key='+FBC.apiKey;
 function toV(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(Array.isArray(v))return{arrayValue:{values:v.map(toV)}};if(typeof v==='object')return{mapValue:{fields:enc(v)}};return{stringValue:String(v)};}
 function enc(o){const f={};for(const k in o)if(o[k]!==undefined)f[k]=toV(o[k]);return f;}
 function fromV(v){if('nullValue'in v)return null;if('booleanValue'in v)return v.booleanValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return v.doubleValue;if('stringValue'in v)return v.stringValue;if('arrayValue'in v)return(v.arrayValue.values||[]).map(fromV);if('mapValue'in v)return dec({fields:v.mapValue.fields});if('timestampValue'in v)return Date.parse(v.timestampValue);return null;}
 function dec(d){const o={};if(d.name)o.id=d.name.split('/').pop();const f=d.fields||{};for(const k in f)o[k]=fromV(f[k]);return o;}
 async function req(url,opt={},tries=1){
  let last;
  for(let i=0;i<tries;i++){
   const ac=new AbortController();const to=setTimeout(()=>ac.abort(),15000);
   try{const r=await fetch(url,{...opt,signal:ac.signal});clearTimeout(to);
    let j=null;const tx=await r.text();try{j=tx?JSON.parse(tx):null;}catch(e){}
    if(!r.ok){const e=new Error((j&&j.error&&(j.error.message||j.error.status))||('HTTP '+r.status));e.status=r.status;e.code=(j&&j.error&&j.error.message)||'';throw e;}
    return j;}
   catch(e){clearTimeout(to);last=e;if(e.status)throw e;if(i<tries-1)await new Promise(r=>setTimeout(r,600));}
  }
  last.offline=true;throw last;
 }
 const post=(u,b)=>req(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)},2);
 const S={user:null,onChange:null};
 const save=()=>{if(S.onChange)S.onChange(S.user);};
 const emailOf=a=>a.includes('@')?a:a+'@'+FBC.domain;
 function pack(r){return{uid:r.localId,email:r.email,idToken:r.idToken,refresh:r.refreshToken,exp:Date.now()+(+r.expiresIn||3600)*1000};}
 const api={
  S,emailOf,req,
  signIn:(a,pw)=>post(AUTH+'signInWithPassword'+K,{email:emailOf(a),password:pw,returnSecureToken:true}).then(pack),
  signAnon:()=>post(AUTH+'signUp'+K,{returnSecureToken:true}).then(pack),
  signUp:(a,pw)=>post(AUTH+'signUp'+K,{email:emailOf(a),password:pw,returnSecureToken:true}).then(pack),
  delAccount:idToken=>post(AUTH+'delete'+K,{idToken}),
  setPass:(idToken,pw)=>post(AUTH+'update'+K,{idToken,password:pw,returnSecureToken:true}).then(pack),
  async login(a,pw){S.user=await api.signIn(a,pw);save();return S.user;},
  restore(u){S.user=u;},
  logout(){S.user=null;save();},
  async tok(){const u=S.user;if(!u)return null;
   if(u.exp-Date.now()<90000){try{const r=await req(TOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(u.refresh)},2);
    u.idToken=r.id_token;u.refresh=r.refresh_token||u.refresh;u.exp=Date.now()+(+r.expires_in||3600)*1000;save();}catch(e){if(e.status){S.user=null;save();}throw e;}}
   return u.idToken;},
  async H(tok){const t=tok===undefined?await api.tok():tok;return t?{Authorization:'Bearer '+t}:{};},
  async get(path,tok){try{return dec(await req(FS+'/'+path,{headers:await api.H(tok)},2));}catch(e){if(e.status===404)return null;throw e;}},
  async set(path,obj,mask,tok){const q=mask?'?'+mask.map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&'):'';
   return dec(await req(FS+'/'+path+q,{method:'PATCH',headers:{...await api.H(tok),'Content-Type':'application/json'},body:JSON.stringify({fields:enc(obj)})},2));},
  async del(path,tok){return req(FS+'/'+path,{method:'DELETE',headers:await api.H(tok)},2);},
  async list(path,tok){const out=[];let pt='';do{const r=await req(FS+'/'+path+'?pageSize=300'+(pt?'&pageToken='+encodeURIComponent(pt):''),{headers:await api.H(tok)},2);(r.documents||[]).forEach(d=>out.push(dec(d)));pt=r.nextPageToken||'';}while(pt);return out;},
  msg(e){const c=(e&&e.code||e&&e.message||'')+'';
   if(e&&e.offline)return'Sin conexión con el servidor. Comprueba internet.';
   if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(c))return'Usuario o clave incorrectos.';
   if(/TOO_MANY/.test(c))return'Demasiados intentos. Espera unos minutos.';
   if(/EMAIL_EXISTS/.test(c))return'Ese usuario ya existe.';
   if(/PERMISSION|403/.test(c)||e&&e.status===403)return'Sin permiso para hacer eso.';
   return'Error: '+c.slice(0,80);}
 };
 return api;
})();
/* Realtime Database por REST (presencia, retos y partidas) */
const RT=(()=>{const B='https://ajedrez-siurot-default-rtdb.europe-west1.firebasedatabase.app/';
 const url=async p=>{const t=await FB.tok();return B+p+'.json?auth='+encodeURIComponent(t||'');};
 const SV={'.sv':'timestamp'};
 return{SV,off:0,srv(){return Date.now()+RT.off;},
  async get(p){return FB.req(await url(p),{},2);},
  async put(p,v){return FB.req(await url(p),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async patch(p,v){return FB.req(await url(p),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async post(p,v){return FB.req(await url(p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)},2);},
  async del(p){return FB.req(await url(p),{method:'DELETE'},2);},
  async sync(p){const r=await RT.put(p,SV);if(typeof r==='number')RT.off=r-Date.now();return r;}};
})();
/* claves: 3 números + 3 letras minúsculas (sin caracteres que se confunden) */
function genClave(){const D='23456789',L='abcdefghjkmnpqrstuvwxyz',r=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;};let s='';for(let i=0;i<3;i++)s+=D[r(D.length)];for(let i=0;i<3;i++)s+=L[r(L.length)];return s;}
const claveOK=c=>/^[0-9]{3}[a-z]{3}$/.test(c);

/* 👁 ver/ocultar clave en todos los campos de contraseña */
(function(){const add=i=>{if(i.dataset.eye||i.type!=='password')return;i.dataset.eye=1;const w=document.createElement('span');w.style.cssText='position:relative;display:block;width:'+(i.style.width||'100%');i.parentNode.insertBefore(w,i);w.appendChild(i);i.style.width='100%';i.style.boxSizing='border-box';i.style.paddingRight='46px';
 const b=document.createElement('button');b.type='button';b.textContent='👁';b.title='Ver clave';b.setAttribute('aria-label','Ver clave');b.style.cssText='position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;font-size:1.2rem;cursor:pointer;padding:0;opacity:.75';
 b.onclick=e=>{e.preventDefault();const v=i.type==='password';i.type=v?'text':'password';b.textContent=v?'🙈':'👁';b.title=v?'Ocultar clave':'Ver clave';i.focus();};w.appendChild(b);};
 const scan=r=>{(r.querySelectorAll?r.querySelectorAll('input[type=password]'):[]).forEach(add);};
 const go=()=>{scan(document);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches&&n.matches('input[type=password]'))add(n);else scan(n);}}))).observe(document.body,{childList:true,subtree:true});};
 if(document.body)go();else document.addEventListener('DOMContentLoaded',go);})();

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

function modal({title='',html='',buttons=[{t:'Aceptar',v:true}]}){return new Promise(res=>{const bg=document.createElement('div');bg.className='mbg';bg.innerHTML=`<div class="modal"><h3>${title}</h3><div>${html}</div><div class="bt">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;document.body.appendChild(bg);
 const done=v=>{bg.remove();res(v);};$$('button[data-i]',bg).forEach(b=>b.onclick=()=>{const bt=buttons[+b.dataset.i];done(typeof bt.v==='function'?bt.v(bg):bt.v);});const f=$('input,textarea',bg);if(f)f.focus();});}
const confirmM=(title,html,ok='Aceptar',red)=>modal({title,html,buttons:[{t:'Cancelar',cls:'ghost',v:false},{t:ok,cls:red?'red':'',v:true}]});
const askM=(title,html,ok='Aceptar')=>modal({title,html,buttons:[{t:'Cancelar',cls:'ghost',v:null},{t:ok,v:bg=>$$('input,textarea,select',bg).map(i=>i.value)}]});

const A={users:[],torneos:[],hof:[],cfg:{url:'https://ajedrezsiurot.com/',aviso:''},tab:'usuarios',sel:new Set(),q:'',grp:'',est:'',tid:null,timer:null};

/* ---------- sesión ---------- */
FB.S.onChange=u=>{try{u?localStorage.setItem('adm',JSON.stringify(u)):localStorage.removeItem('adm');}catch(e){}};
let dInst=null;const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

 if(u&&u.email===FBC.admin){FB.restore(u);try{await loadAll();return shell();}catch(e){FB.logout();}}

function loginView(){$('#app').innerHTML=`<div class="card login"><h2>♞ Ajedrez Siurot</h2><p class="muted">Administración</p><input id="em" type="email" placeholder="Correo" value="${FBC.admin}" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" id="go" style="width:100%">Entrar</button><p class="err" id="er"></p></div>`;

 $$('nav button').forEach(b=>b.onclick=()=>{A.tab=b.dataset.t;A.tid=null;render();});$('#out').onclick=()=>{FB.logout();loginView();};instUI();render();}

 ({usuarios:vUsers,alta:vAlta,torneos:vTorneos,hof:vHof,ajustes:vAjustes})[A.tab](m);}

async function bulkDel(g){
 const groups=[...new Set(A.users.map(u=>u.grupo||'(sin grupo)'))].sort((a,b)=>a.localeCompare(b,'es'));
 if(!g){const r=await askM('🗑 Borrar un grupo entero',`<p>Elige el grupo que quieres borrar:</p><select style="width:100%">${groups.map(x=>`<option value="${esc(x)}">${esc(x)} (${A.users.filter(u=>(u.grupo||'(sin grupo)')===x).length})</option>`).join('')}</select>`,'Continuar');if(!r)return;g=r[0];}
 const list=A.users.filter(u=>(u.grupo||'(sin grupo)')===g);if(!list.length)return toast('Ese grupo está vacío',1);
 if(!await confirmM('⚠️ Aviso 1 de 2',`Vas a eliminar a <b>${list.length} usuarios</b> del grupo <b>${esc(g)}</b>.<br><br>Se borran sus cuentas, sus claves y su puntuación del salón de la fama.`,'Entiendo, continuar',true))return;
 const r2=await askM('🛑 Aviso 2 de 2 · Última oportunidad',`<p><b>Esta acción NO se puede deshacer.</b> Se borrarán ${list.length} usuarios de «${esc(g)}».</p><p>Para confirmar, escribe <b>BORRAR</b>:</p><input style="width:100%" autocomplete="off">`,'Borrar grupo');
 if(!r2||r2[0].trim().toUpperCase()!=='BORRAR')return r2?toast('No has escrito BORRAR: no se ha borrado nada',1):0;
 let n=0,fail=0;
 for(const u of list){toast(`Borrando ${++n} de ${list.length}…`);
  try{try{const s=await FB.signIn(u.alias,u.clave);await FB.delAccount(s.idToken);}catch(e){}
   await FB.del('users/'+u.id);try{await FB.del('hof/'+u.id);}catch(e){}
   A.users=A.users.filter(x=>x.id!==u.id);A.hof=A.hof.filter(x=>x.id!==u.id);A.sel.delete(u.id);}catch(e){fail++;}}
 if(A.grp===g)A.grp='';
 toast(fail?`Borrados ${list.length-fail}; fallaron ${fail}`:`Grupo «${g}» eliminado (${list.length})`,!!fail);render();}
async function userAct(a,u){

  try{try{const s=await FB.signIn(u.alias,u.clave);await FB.delAccount(s.idToken);}catch(e){}
   await FB.del('users/'+u.id);try{await FB.del('hof/'+u.id);}catch(e){}
   A.users=A.users.filter(x=>x.id!==u.id);A.hof=A.hof.filter(x=>x.id!==u.id);toast('Usuario eliminado');render();}catch(e){toast(FB.msg(e),1);}}
 if(a==='rs'){if(!await confirmM('Nueva clave',`Se generará una clave nueva para <b>${esc(nm(u))}</b>.`,'Generar'))return;
  try{const nc=genClave();const s=await FB.signIn(u.alias,u.clave);await FB.setPass(s.idToken,nc);await FB.set('users/'+u.id,{clave:nc},['clave']);u.clave=nc;toast('Nueva clave: '+nc);
   await modal({title:'Nueva clave',html:`<p>Usuario: <span class="mono">${esc(u.alias)}</span><br>Clave: <span class="mono" style="font-size:1.4rem">${nc}</span></p>`,buttons:[{t:'Imprimir tarjeta',cls:'ghost',v:()=>{printCards([u]);return 1;}},{t:'Cerrar',v:1}]});}catch(e){toast(FB.msg(e),1);}}
 if(a==='ed'){const r=await askM('Editar',`<p>Nombre<br><input value="${esc(u.nombre)}" style="width:100%"></p><p>Grupo<br><input value="${esc(u.grupo)}" style="width:100%"></p>`,'Guardar');if(!r)return;

 $('#b1',m).onclick=()=>createUsers([$('#n1',m).value],$('#g1',m).value.trim(),m);

async function createUsers(names,grupo,m){names=names.map(s=>s.trim()).filter(Boolean);if(!names.length)return toast('Escribe algún nombre',1);
 const used=new Set(A.users.map(u=>u.alias));const out=[],fail=[];$$('button',m).forEach(b=>b.disabled=true);
 const prog=$('#res',m);
 for(let i=0;i<names.length;i++){prog.innerHTML=`<div class="card">Creando ${i+1} de ${names.length}…</div>`;
  const nombre=names[i];const base=slugAlias(nombre);if(!base){fail.push([nombre,'Nombre no válido']);continue;}
  let ok=false,n=0;while(!ok&&n<30){const alias=n?base+(n+1):base;n++;if(used.has(alias))continue;const clave=genClave();
   try{const s=await FB.signUp(alias,clave);const u={alias,nombre,grupo,clave,ultimoLogin:null,alta:Date.now()};await FB.set('users/'+s.uid,u);used.add(alias);const nu={id:s.uid,...u};A.users.push(nu);out.push(nu);ok=true;}
   catch(e){if(/EMAIL_EXISTS/.test(e.code||'')){used.add(alias);continue;}fail.push([nombre,FB.msg(e)]);break;}}
  if(!ok&&!fail.find(f=>f[0]===nombre))fail.push([nombre,'No se encontró usuario libre']);}
 $$('button',m).forEach(b=>b.disabled=false);
 prog.innerHTML=`<div class="card"><h2>Creados: ${out.length}${fail.length?` · <span class="err">fallos: ${fail.length}</span>`:''}</h2>${fail.map(f=>`<p class="err">${esc(f[0])}: ${esc(f[1])}</p>`).join('')}${out.length?`<div class="row" style="margin-bottom:8px"><button class="btn" id="pc">🖨️ PDF con usuarios y claves</button></div><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Clave</th></tr></thead><tbody>${out.map(u=>`<tr><td>${esc(u.nombre)}</td><td class="mono">${esc(u.alias)}</td><td class="mono">${esc(u.clave)}</td></tr>`).join('')}</tbody></table>`:''}</div>`;
 A.users.sort((a,b)=>nm(a).localeCompare(nm(b),'es'));if($('#pc',m))$('#pc',m).onclick=()=>printCards(out);}

async function vTorneo(m,t){if(!t){A.tid=null;return render();}
 let js=[],rq=[],rkp={};const load=async()=>{try{js=await FB.list(`torneos/${t.id}/jugadores`);if(t.estado==='activo'){try{const r=await RT.get(`arena/${t.id}/req`)||{};rq=Object.entries(r).filter(([id,x])=>x&&x.s==='pend').map(([id,x])=>({id,n:x.n}));}catch(e){}}
   if(t.estado==='activo'){let lv={};try{lv=await RT.get(`arena/${t.id}/p`)||{};}catch(e){}const now=Date.now();rkp=Object.fromEntries(arenaRank(Object.entries(lv).filter(([i,p])=>p).map(([i,p])=>({id:i,...p}))).map((r,i)=>[r.id,i]));

   try{for(const j of js)await FB.del(`torneos/${t.id}/jugadores/${j.id}`);await FB.del('torneos/'+t.id);A.torneos=A.torneos.filter(x=>x!==t);A.tid=null;toast('Torneo eliminado');render();}catch(e){toast(FB.msg(e),1);}};
  if($('#add',m))$('#add',m).onclick=async()=>{const have=new Set(js.map(j=>j.id));const c=active().filter(u=>!have.has(u.id));if(!c.length)return toast('No hay más usuarios activos',1);
   const r=await askM('Añadir jugador',`<select style="width:100%">${c.map(u=>`<option value="${u.id}">${esc(nm(u))} (${esc(u.alias)}) ${esc(u.grupo)}</option>`).join('')}</select>`,'Añadir');if(!r)return;
   const u=A.users.find(x=>x.id===r[0]);const j={alias:u.alias,nombre:nm(u),grupo:u.grupo||'',puntos:0,partidas:0,fuera:false};try{await FB.set(`torneos/${t.id}/jugadores/${u.id}`,j);js.push({id:u.id,...j});draw();}catch(e){toast(FB.msg(e),1);}};};
 await load();draw();
 if(t.estado!=='terminado')A.timer=setInterval(async()=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;if($('.mbg'))return;await load();draw();},15000);}
async function finish(t,js,draw){if(!await confirmM('Terminar torneo',`Se cerrará «${esc(t.nombre)}» y los puntos se sumarán al salón de la fama. No se puede deshacer.`,'Terminar'))return;
 try{await finishTorneo(t);toast('Torneo terminado ✔️');draw?draw():render();}catch(e){toast(FB.msg(e),1);}}
async function activar(t){const now=Date.now(),p={estado:'activo',inicioReal:now,fin:now+(t.duracion||20)*60000};await FB.set('torneos/'+t.id,p,Object.keys(p));Object.assign(t,p);}
/* orden final: puntos; si hay empate, resultados directos entre los empatados (emparejamientos); luego victorias y menos partidas */
function arenaRank(rows){const by={};rows.forEach(r=>(by[r.pts||0]=by[r.pts||0]||[]).push(r));
 return Object.keys(by).map(Number).sort((a,b)=>b-a).flatMap(k=>{const g=by[k];if(g.length>1){const ids=new Set(g.map(x=>x.id));g.forEach(x=>{x.h2h=0;Object.entries(x.vs||{}).forEach(([o,v])=>{if(ids.has(o))x.h2h+=v;});});}
  return g.sort((a,b)=>(b.h2h||0)-(a.h2h||0)||(b.w||0)-(a.w||0)||(a.pa||0)-(b.pa||0)||String(a.n).localeCompare(String(b.n),'es'));});}
async function finishTorneo(t){
 let lv={};try{lv=await RT.get(`arena/${t.id}/p`)||{};}catch(e){}
 for(const [uid,p] of Object.entries(lv))if(!p.guest)await FB.set(`torneos/${t.id}/jugadores/${uid}`,{alias:p.a||'',nombre:p.n||'',grupo:p.g||'',puntos:p.pts||0,partidas:p.pa||0,fuera:!!p.fuera});
 const rk=arenaRank(Object.entries(lv).filter(([id,p])=>p&&!p.fuera).map(([id,p])=>({id,...p}))),pos=Object.fromEntries(rk.map((r,i)=>[r.id,i]));
 const js=(await FB.list(`torneos/${t.id}/jugadores`)).sort((a,b)=>(pos[a.id]??1e6)-(pos[b.id]??1e6)||(b.puntos||0)-(a.puntos||0)||(b.partidas||0)-(a.partidas||0));
 const ok=js.filter(j=>!j.fuera&&((j.partidas||0)>0||(j.puntos||0)>0));
 const podio=ok.slice(0,3).map(j=>({alias:j.alias,nombre:j.nombre,puntos:j.puntos||0}));
 const clasif=rk.filter(r=>(r.pa||0)>0||(r.pts||0)>0).slice(0,60).map(r=>({n:r.n,g:r.g||'',p:r.pts||0,w:r.w||0,d:r.d||0,l:r.l||0}));
 for(const j of ok){const h=A.hof.find(x=>x.id===j.id)||{id:j.id,puntos:0,torneos:0,mejor:0};const n={alias:j.alias,nombre:j.nombre,grupo:j.grupo||'',puntos:(h.puntos||0)+(j.puntos||0),torneos:(h.torneos||0)+1,mejor:Math.max(h.mejor||0,j.puntos||0)};await FB.set('hof/'+j.id,n);const i=A.hof.findIndex(x=>x.id===j.id);i<0?A.hof.push({id:j.id,...n}):A.hof[i]={id:j.id,...n};}
 const p={estado:'terminado',fin:Date.now(),podio,clasif};await FB.set('torneos/'+t.id,p,Object.keys(p));Object.assign(t,p);
 try{await RT.del('arena/'+t.id);}catch(e){}setTimeout(()=>RT.del('arena/'+t.id).catch(()=>{}),9000);}
let autoBusy=false;
async function autoTick(){if(autoBusy||!FB.S.user)return;autoBusy=true;
 try{const fresh=await FB.list('torneos');for(const f of fresh){const o=A.torneos.find(x=>x.id===f.id);if(o)Object.assign(o,f);else A.torneos.push(f);}
  const now=Date.now();
  for(const t of A.torneos){
   if(t.estado==='espera'&&t.inicio&&t.inicio<=now){await activar(t);toast('🟢 «'+t.nombre+'» ha empezado');}
   else if(t.estado==='activo'&&t.fin&&now>t.fin+12000){{await finishTorneo(t);toast('🏁 «'+t.nombre+'» terminado: puntos sumados al salón de la fama');}}}
  if(!document.querySelector('.mbg')&&!document.querySelector('.proj')&&!document.querySelector('.sheetov')&&(A.tab==='torneos'&&!A.tid||A.tab==='hof'))render();
 }catch(e){}autoBusy=false;}
setInterval(autoTick,20000);
const seenReq=new Set();let reqN=0;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.18);}catch(e){}}
async function pollReq(){if(!FB.S.user)return;let n=0,fresh=null;
 try{for(const t of A.torneos.filter(x=>x.estado==='activo')){const r=await RT.get(`arena/${t.id}/req`)||{};for(const [id,x] of Object.entries(r)){if(x&&x.s==='pend'){n++;if(!seenReq.has(id)){seenReq.add(id);fresh=x.n;}}}}}catch(e){return;}
 if(fresh){beep();toast('🙋 '+fresh+' pide entrar al torneo');}
 if(n!==reqN){reqN=n;const b=document.querySelector('nav [data-t=torneos]');if(b)b.innerHTML='🏟️ Torneos'+(n?` <span class="pill" style="background:#c0392b;color:#fff">${n}</span>`:'');}
 if(fresh&&A.tab==='torneos'&&A.tid&&!document.querySelector('.mbg')&&!document.querySelector('input:focus'))render();}
setInterval(pollReq,5000);
function projector(t,get,load){const ov=document.createElement('div');ov.className='proj';document.body.appendChild(ov);
 const paint=()=>{const l=get().filter(j=>!j.fuera).slice(0,12);ov.innerHTML=`<button class="btn x" id="px">✕ Cerrar</button><h1>🏆 ${esc(t.nombre)}</h1><table><thead><tr><th>#</th><th>Jugador</th><th>Grupo</th><th class="n">Puntos</th></tr></thead><tbody>${l.map((j,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(j.nombre)}</td><td>${esc(j.grupo)}</td><td class="n"><b>${j.puntos||0}</b></td></tr>`).join('')}</tbody></table>`;$('#px',ov).onclick=()=>{clearInterval(iv);ov.remove();};};
 paint();const iv=setInterval(async()=>{await load();paint();},10000);}
/* ---------- HoF ---------- */
function vHof(m){const l=[...A.hof].sort((a,b)=>(b.puntos||0)-(a.puntos||0)).slice(0,10);
 m.innerHTML=`<div class="card"><h2>🏆 Salón de la fama · Top 10</h2><p class="muted">Suma de los puntos de todos los torneos terminados.</p><table><thead><tr><th>#</th><th>Nombre</th><th>Grupo</th><th class="n">Puntos</th><th class="n">Torneos</th><th class="n">Mejor torneo</th></tr></thead><tbody>${l.map((h,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td><b>${esc(h.nombre)}</b> <span class="muted">${esc(h.alias)}</span></td><td>${esc(h.grupo)}</td><td class="n"><b>${h.puntos||0}</b></td><td class="n">${h.torneos||0}</td><td class="n">${h.mejor||0}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Todavía no hay datos: termina algún torneo.</td></tr>'}</tbody></table></div>
 <div class="card"><h2>Nuevo curso</h2><p class="muted">Restaurar vacía el salón de la fama. Antes se descarga una copia de seguridad (JSON) por si hace falta.</p><div class="row"><button class="btn ghost" id="bk">⬇️ Descargar copia</button><button class="btn red" id="rs">♻️ Restaurar salón de la fama</button></div></div>`;
 const backup=()=>download('salon-fama-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(A.hof,null,1),'application/json');
 $('#bk',m).onclick=backup;
 $('#rs',m).onclick=async()=>{const r=await askM('Restaurar salón de la fama',`<p>Se borrarán los puntos acumulados de <b>${A.hof.length}</b> jugadores. Se descargará antes una copia.</p><p>Escribe <b>RESTAURAR</b> para confirmar:</p><input style="width:100%">`,'Restaurar');if(!r||r[0].trim().toUpperCase()!=='RESTAURAR')return r?toast('No coincide: no se ha borrado nada',1):0;
  try{backup();for(const h of A.hof)await FB.del('hof/'+h.id);A.hof=[];toast('Salón de la fama restaurado');render();}catch(e){toast(FB.msg(e),1);}};}
/* ---------- ajustes ---------- */
function vAjustes(m){const groups=[...new Set(A.users.map(u=>u.grupo).filter(Boolean))].sort();
 m.innerHTML=`<div class="card"><h2>📣 Aviso en la pantalla principal</h2><p class="muted">Se muestra a todo el alumnado (déjalo vacío para quitarlo).</p><input id="av" class="grow" style="width:100%" maxlength="140" placeholder="Hoy torneo en el recreo a las 11:30" value="${esc(A.cfg.aviso)}"><p class="muted" style="margin:10px 0 4px">Dirección de la app (aparece en las tarjetas de claves)</p><input id="ur" style="width:100%" value="${esc(A.cfg.url)}"><div class="row" style="margin-top:10px"><button class="btn" id="sv">Guardar</button></div></div>
 <div class="card"><h2>⬆️ Subir de curso</h2><p class="muted">Cambia el nombre de grupo de golpe (ej. 4ºA → 5ºA). Deja en blanco los que no cambien.</p>${groups.length?`<table>${groups.map(g=>`<tr><td>${esc(g)} <span class="muted">(${A.users.filter(u=>u.grupo===g).length})</span></td><td>→</td><td><input class="ng" data-g="${esc(g)}" placeholder="Nuevo grupo"></td></tr>`).join('')}</table><div class="row" style="margin-top:8px"><button class="btn" id="up">Aplicar cambios</button></div>`:'<p class="muted">Aún no hay grupos.</p>'}</div>
 <div class="card"><h2>📤 Exportar</h2><div class="row"><button class="btn ghost" id="cu">⬇️ Usuarios (CSV)</button></div></div>
 <div class="card"><h2>🔒 Protección de datos</h2><p class="muted" style="margin:0">Solo se guardan un usuario (nombre + inicial), el grupo y la fecha del último acceso. Sin apellidos completos, sin correos ni datos personales. Servidor en la UE (Firestore eur3). Al eliminar un usuario se borra su cuenta y su puntuación.</p></div>`;
 $('#sv',m).onclick=async()=>{const c={aviso:$('#av',m).value.trim(),url:$('#ur',m).value.trim()||'https://ajedrezsiurot.com/'};try{await FB.set('config/main',c);Object.assign(A.cfg,c);toast('Guardado');}catch(e){toast(FB.msg(e),1);}};
 $('#cu',m).onclick=()=>download('usuarios-ajedrez.csv',csvUsers(A.users),'text/csv');
 if($('#up',m))$('#up',m).onclick=async()=>{const map={};$$('.ng',m).forEach(i=>{if(i.value.trim())map[i.dataset.g]=i.value.trim();});const ks=Object.keys(map);if(!ks.length)return toast('No hay cambios',1);
  if(!await confirmM('Subir de curso',ks.map(k=>`${esc(k)} → ${esc(map[k])}`).join('<br>'),'Aplicar'))return;
  try{const orig=A.users.map(u=>[u,u.grupo]);for(const [u,g] of orig)if(map[g]){await FB.set('users/'+u.id,{grupo:map[g]},['grupo']);u.grupo=map[g];}toast('Grupos actualizados');render();}catch(e){toast(FB.msg(e),1);}};}
boot();
</script></body></html>
